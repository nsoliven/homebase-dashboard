<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tower 500 Fan Controller</title>
<style>
/* Always dark: a big 3D stage, one slim toolbar above it, and a flat panel beside it. */
:root{
  --bg:#0b0e15; --surface:#121620; --surface-2:#191e2a; --line:#232a37; --fg:#e8ebf2; --muted:#8d95a7;
  --accent:#7d8cff; --cool:#5fb0ff; --warm:#ff9a4a; --ok:#4cc38a; --bad:#ff6b5c;
  --glass:rgba(125,140,255,.14); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --scene-bg:#04060a; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.45;padding-block:20px 32px;padding-inline:clamp(16px,3vw,32px)}
html.embed body{padding-block:0;padding-inline:0;background:#11141b}
html.embed header.top{display:none}
.wrap{max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
h1{margin:0;font-size:22px;letter-spacing:-.01em}
.muted{color:var(--muted);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;min-width:0}
.seg .seg-l{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 6px 0 7px}
.seg button{font:500 12px var(--font-ui);color:var(--muted);background:none;border:0;border-radius:7px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--glass);color:var(--fg)}
button:focus-visible,.pt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.swatches{display:inline-flex;gap:5px;padding:0 4px 0 8px;border-left:1px solid var(--line);margin-left:2px}
.swatches button{width:16px;height:16px;padding:0;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.cpick{display:inline-flex;align-items:center;padding:0 4px;cursor:pointer}
.cpick input{width:22px;height:20px;padding:0;border:0;background:none;cursor:pointer}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.scene{position:relative;border-radius:16px;overflow:hidden;background:var(--scene-bg);min-width:0}
#view{display:block;width:100%;height:clamp(440px,76vh,880px);}
/* framed: vh would be the frame's own height, so the dashboard sends its viewport height instead */
html.embed #view{height:clamp(460px,calc(var(--host-vh,900px) * .74),900px);background:var(--scene-bg);touch-action:none;cursor:grab}
.stage-hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:11.5px;color:var(--muted);background:rgba(18,22,32,.72);border:1px solid var(--line);border-radius:999px;padding:4px 11px;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .2s}
.scene:hover .stage-hint{opacity:1}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;box-shadow:var(--shadow);font-size:12px;transform:translate(-50%,-115%);white-space:nowrap}
.tip b{display:block;font-size:13px}
.tip span{font-family:var(--font-mono);color:var(--muted)}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.l3{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;font:500 11.5px var(--font-ui);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 7px;cursor:pointer;white-space:nowrap;will-change:transform}
.l3 .dot{width:8px;height:8px;border-radius:50%;flex:none}
.l3 b{font-family:var(--font-mono);font-weight:500;color:var(--muted);font-size:11px}
.l3[aria-pressed="true"]{border-color:var(--accent)}
.side{display:flex;flex-direction:column;gap:20px;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 6px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.groups{display:flex;flex-direction:column;gap:2px}
.grp{display:grid;grid-template-columns:10px minmax(0,1fr) auto;column-gap:10px;row-gap:6px;align-items:center;width:100%;padding:8px 10px;border-radius:10px;border:1px solid transparent;background:none;color:var(--fg);font:500 13px var(--font-ui);text-align:left;cursor:pointer}
.grp:hover{background:var(--surface)}
.grp[aria-selected="true"]{background:var(--surface-2);border-color:var(--line)}
.grp i{width:10px;height:10px;border-radius:3px}
.grp .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp .rpm{font-family:var(--font-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.grp .duty{grid-column:2/4;height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.grp .duty b{display:block;height:100%;border-radius:3px}
.detail-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.detail-head h2{margin:0;font-size:16px;font-weight:600}
.detail-head span{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font:500 12px var(--font-ui);border:1px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:var(--glass)}
.chip[disabled]{opacity:.4;cursor:not-allowed}
.curve svg{display:block;width:100%;height:auto;touch-action:none}
.curve .pt{cursor:grab}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip.running{position:relative;overflow:hidden;color:var(--fg);border-color:var(--accent);cursor:progress;opacity:1}
.chip.running::after{content:'';position:absolute;left:0;bottom:0;height:100%;width:0;background:var(--glass);animation:fill var(--dur,4s) linear forwards;pointer-events:none}
@keyframes fill{to{width:100%}}
.grp .duty{position:relative;overflow:visible}
.grp .duty em{position:absolute;top:-3px;width:2px;height:9px;margin-left:-1px;background:var(--fg);border-radius:1px}
.savebar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:8px;font-size:12px;color:var(--warm)}
.savebar span{margin-right:auto}
.btn{font:600 12.5px var(--font-ui);border-radius:9px;padding:7px 14px;border:1px solid var(--accent);background:var(--accent);color:#0b0d12;cursor:pointer}
.hold{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);position:relative}
.hold input[type=range]{width:100%;accent-color:var(--accent)}
.hold .chips{margin:0}
.hold-btn{position:relative;width:100%}
.hold-btn.running{background:var(--glass);color:var(--fg)}
.hold-bar{display:block;height:3px;border-radius:2px;background:var(--accent);margin-top:-6px;transition:width .25s linear}
.apply{font-size:12px;color:var(--muted);margin-top:6px}
.apply.ok{color:var(--ok)}
.apply.bad{color:var(--bad)}
.bal-row{display:grid;grid-template-columns:58px minmax(0,1fr) 64px;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-top:6px}
.bal-row b{font-family:var(--font-mono);font-weight:500;color:var(--fg);text-align:right;font-variant-numeric:tabular-nums}
.bal{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.bal i{display:block;height:100%;border-radius:4px;transition:width .3s}
.tag{font-family:var(--font-mono);font-size:10.5px;border-radius:6px;padding:1px 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;letter-spacing:0;text-transform:none}
.tag.good{border-color:var(--ok);color:var(--ok)}
.tag.bad{border-color:var(--bad);color:var(--bad)}
@media (max-width:560px){.seg button{padding:5px 8px}.swatches{gap:4px}#view,html.embed #view{height:auto;aspect-ratio:4/5}}
@media (prefers-reduced-motion:reduce){.bal i{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>prox · The Tower 500</h1>
    <span class="muted" id="live-note">Modeled readings · fan control not connected</span>
  </header>

  <div class="bar" aria-label="View controls">
    <div class="seg" role="group" aria-label="Camera">
      <button id="cam-iso" aria-pressed="true">3/4</button>
      <button id="cam-front" aria-pressed="false">Front</button>
      <button id="cam-right" aria-pressed="false">Radiator</button>
      <button id="cam-back" aria-pressed="false">Back</button>
      <button id="cam-gpu" aria-pressed="false">GPU</button>
      <button id="cam-top" aria-pressed="false">Top</button>
    </div>
    <div class="seg" role="group" aria-label="Case panels">
      <button id="pan-on" aria-pressed="true">Case</button>
      <button id="pan-ghost" aria-pressed="false">X-ray</button>
      <button id="pan-off" aria-pressed="false">Bare</button>
    </div>
    <div class="seg" role="group" aria-label="Airflow">
      <span class="seg-l">Air</span>
      <button id="air-smoke" aria-pressed="false">Smoke</button>
      <button id="air-streaks" aria-pressed="false">Streaks</button>
      <button id="air-both" aria-pressed="true">Both</button>
      <button id="air-off" aria-pressed="false">Off</button>
      <button id="tog-tint" aria-pressed="true" title="Color the air from cool (blue) to warm (orange)">Temp color</button>
    </div>
    <div class="seg" role="group" aria-label="RGB lighting">
      <span class="seg-l">RGB</span>
      <button id="rgb-off" aria-pressed="false">Off</button>
      <button id="rgb-on" aria-pressed="true">On</button>
      <span class="swatches" id="rgb-sw" role="group" aria-label="RGB color"></span>
      <label class="cpick" title="Pick any color"><input type="color" id="rgb-color" value="#2f5bff" aria-label="Custom RGB color"></label>
    </div>
    <div class="seg" role="group" aria-label="Layers">
      <button id="tog-heat" aria-pressed="true" title="Glow where the CPU, GPU and radiator run hot">Heat</button>
      <button id="tog-lbl" aria-pressed="false" title="Name tags on each fan group">Labels</button>
    </div>
  </div>

  <div class="grid">
    <section class="scene" aria-label="3D case view">
      <canvas id="view" aria-label="Rotatable 3D model of the case with fans and airflow. Drag to orbit, scroll to zoom, click a fan to select its group."></canvas>
      <div class="labels" id="labels" hidden></div>
      <div class="tip" id="tip" hidden></div>
      <div class="stage-hint" id="stage-hint">Drag to rotate · click, then scroll to zoom</div>
    </section>

    <aside class="side" aria-label="Fans">
      <div class="ctl" id="ctl" hidden><span class="sec-h" style="margin:0">Control</span><div class="seg" role="group" aria-label="Who drives the fans"><button id="mode-curves" aria-pressed="false" title="Homebase runs the curves below">Your curves</button><button id="mode-bios" aria-pressed="true" title="Hand every fan back to the BIOS curve">BIOS</button></div></div>
      <div>
        <div class="sec-h"><span>Fans</span><span>rpm</span></div>
        <div class="groups" id="groups" role="listbox" aria-label="Fan groups"></div>
      </div>
      <div>
        <div class="detail-head"><h2 id="g-name">Radiator</h2><span id="g-meta">38% · 61°C</span></div>
        <div class="chips" id="dir-row" role="group" aria-label="Rear fan direction" hidden><button class="chip" id="dir-in" aria-pressed="true">Intake</button><button class="chip" id="dir-out" aria-pressed="false">Exhaust</button></div>
        <div class="chips" role="group" aria-label="Curve presets"><button class="chip" data-preset="silent" aria-pressed="false">Silent</button><button class="chip" data-preset="bios" aria-pressed="true">Your BIOS</button><button class="chip" data-preset="cool" aria-pressed="false">Cold</button><button class="chip" id="identify" hidden title="Spin this group to 100% for 4 s while every other group stops (never the pump), so you can see which fans it drives">Identify</button></div>
        <div class="curve" title="Temperature → fan duty. Drag a point to shape the curve."><svg id="curve" viewBox="0 0 360 220" role="img" aria-label="Fan curve editor"></svg></div>
        <div class="savebar" id="savebar" hidden><span>Unsaved curve</span><button class="chip" id="revert">Revert</button><button class="btn" id="save">Save</button></div>
        <div class="apply" id="apply-state" role="status" hidden></div>
        <div class="hold" id="hold-box" hidden>
          <div class="sec-h"><span>Hold speed</span><span id="hold-val">50%</span></div>
          <input type="range" id="hold-duty" min="0" max="100" step="5" value="50" aria-label="Hold speed">
          <div class="chips" id="hold-times" role="group" aria-label="Hold for"><button class="chip" data-s="10">10 s</button><button class="chip" data-s="30">30 s</button><button class="chip" data-s="60" aria-pressed="true">1 min</button><button class="chip" data-s="300">5 min</button><button class="chip" data-s="900">15 min</button><button class="chip" data-s="hold">Until released</button></div>
          <button class="btn hold-btn" id="hold-btn">Hold 50%</button><i class="hold-bar" id="hold-bar" hidden></i>
          <div class="muted" id="hold-hint"></div>
        </div>
      </div>
      <div title="Estimated from fan RPM and size; radiators restrict about 35%. More intake than exhaust keeps dust out.">
        <div class="sec-h"><span>Airflow</span><span class="tag" id="press">Balanced</span></div>
        <div class="bal-row"><span>Intake</span><div class="bal"><i id="bal-in" style="background:var(--cool)"></i></div><b id="cfm-in">0 CFM</b></div>
        <div class="bal-row"><span>Exhaust</span><div class="bal"><i id="bal-out" style="background:var(--warm)"></i></div><b id="cfm-out">0 CFM</b></div>
      </div>
    </aside>
  </div>
</div>

<script src="/case/vendor/three.min.js"></script>
<script src="/case/vendor/OrbitControls.js"></script>
<script src="/case/vendor/CopyShader.js"></script>
<script src="/case/vendor/LuminosityHighPassShader.js"></script>
<script src="/case/vendor/EffectComposer.js"></script>
<script src="/case/vendor/RenderPass.js"></script>
<script src="/case/vendor/ShaderPass.js"></script>
<script src="/case/vendor/UnrealBloomPass.js"></script>
<script src="/case/case.js"></script>

</body>
</html>
